T('TIU','Deret: 3, 5, 9, 17, 33, ... angka berikutnya?',['55','63','65','67','69'],2,'Selisih 2, 4, 8, 16, lalu 32, jadi 33 + 32 = 65.'),
K('Atasan memberi tugas mendadak saat Anda sedang mengerjakan tugas penting lain. Anda...',['Menolak tugas baru karena pekerjaan lain sedang menumpuk dan penting','Menyelesaikan tugas baru lebih dulu lalu membiarkan tugas lama tertunda','Meminta arahan prioritas kepada atasan dan menyusun jadwal keduanya','Meminta rekan mengerjakan tugas baru tanpa memberi tahu atasan sama sekali','Mengerjakan kedua tugas bersamaan tanpa memberi tahu atasan soal kendalanya'],[1,2,5,1,3],'Terbaik: prioritas dibahas dengan atasan agar kedua tugas tetap terkendali. Paling kurang tepat: menolak tugas dari atasan bertentangan dengan sikap profesional.'),
K('Rekan kerja sering terlambat sehingga pekerjaan tim terhambat. Anda...',['Langsung melaporkan keterlambatan rekan kepada atasan tanpa bicara dengannya','Membiarkan saja karena keterlambatan itu bukan tanggung jawab saya pribadi','Menegur dengan baik dan menanyakan kendala yang dihadapi rekan tersebut','Ikut datang terlambat karena merasa pekerjaan tim tetap tidak akan selesai','Menyindir rekan tersebut di grup tim agar ia merasa malu sendiri'],[3,2,5,1,1],'Terbaik: bicara langsung dan menggali kendala rekan lebih dulu. Kurang tepat: melapor tanpa bicara melewati tahap komunikasi. Paling kurang tepat: ikut terlambat memperburuk disiplin tim.'),
K('Anda ditempatkan di daerah dengan budaya berbeda. Anda...',['Mempelajari adat setempat, bergaul dengan warga sekitar, dan menghormati kebiasaan mereka saat bekerja','Bergaul hanya dengan sesama pendatang karena merasa lebih nyaman dan aman','Mengajukan permohonan pindah tugas ke daerah yang budayanya lebih dekat','Mengikuti kebiasaan setempat seperlunya saja selama jam kerja berlangsung','Mengkritik budaya setempat karena dianggap kurang sesuai dengan cara kerja kantor'],[5,2,1,3,1],'Terbaik: beradaptasi dengan menghormati adat dan bergaul dengan warga. Paling kurang tepat: meminta pindah berarti menghindari tugas, bukan menyesuaikan diri.'),
K('Warga marah karena berkasnya ditolak akibat persyaratan kurang. Anda...',['Menjelaskan dengan sabar apa yang kurang dan cara melengkapinya','Meminta warga tersebut segera pergi','Menerima berkas yang kurang','Membalas dengan nada tinggi','Menyuruh warga bertanya kepada petugas lain yang lebih paham soal persyaratan'],[5,1,2,1,2],'Terbaik: menjelaskan dengan sabar dan membantu warga melengkapi syarat. Paling kurang tepat: menyuruh warga pergi bertentangan dengan prinsip pelayanan publik.'),
K('Anda menemukan kesalahan data pada laporan yang sudah dikirim. Anda...',['Diam saja dan berharap kesalahan itu tidak pernah diketahui siapa pun','Segera melapor kepada atasan dengan menjelaskan letak kesalahan, lalu mengirimkan laporan revisi yang benar','Menunggu sampai atasan atau rekan menegur kesalahan data tersebut','Memperbaiki data secara diam-diam tanpa memberi tahu atasan maupun penerima laporan','Menyalahkan sistem yang dipakai karena dianggap sering menghasilkan data keliru'],[1,5,2,3,1],'Terbaik: jujur melapor dan memberi revisi. Kurang tepat: memperbaiki diam-diam menyembunyikan kesalahan dari pihak berkepentingan. Paling kurang tepat: diam membiarkan data keliru dipakai.'),
K('Kantor menerapkan teknologi baru yang belum Anda kuasai. Anda...',['Menolak memakainya karena cara lama sudah terbukti nyaman dan cukup efisien','Mengikuti pelatihan yang tersedia dan mencoba langsung teknologi itu dalam pekerjaan sehari-hari','Menunggu rekan yang lebih paham menguasainya lebih dulu baru ikut belajar','Memakainya hanya ketika ada aturan tegas yang mewajibkan seluruh pegawai','Mengeluh kepada rekan karena perubahan itu dianggap merepotkan pekerjaan harian'],[1,5,3,2,1],'Terbaik: aktif belajar dan mempraktikkan teknologi baru. Kurang tepat: menunggu rekan lain menunda proses belajar. Paling kurang tepat: menolak menghambat adaptasi organisasi.'),
K('Pimpinan mengambil keputusan yang menurut Anda kurang tepat. Anda...',['Menyampaikan pendapat dengan data secara sopan, lalu melaksanakan','Menolak melaksanakan keputusan itu sampai pimpinan mengubahnya sendiri','Menggerutu bersama rekan di luar rapat tentang keputusan pimpinan tersebut','Diam dan melaksanakan keputusan itu apa adanya tanpa memberi masukan','Melaksanakan keputusan itu setengah hati sambil berharap segera diubah pimpinan'],[5,1,1,3,2],'Terbaik: masukan disampaikan sopan dengan data, lalu keputusan dijalankan. Kurang tepat: diam tanpa masukan melewatkan peluang perbaikan. Paling kurang tepat: menolak melaksanakan melanggar kewajiban menaati atasan.'),
K('Dalam tim ada anggota yang pasif. Anda...',['Mengambil alih seluruh pekerjaan anggota yang pasif agar target tim tercapai','Mengajak anggota tersebut berdiskusi, lalu membagi tugas sesuai kemampuan dan minatnya agar ikut berkontribusi','Melaporkan anggota tersebut kepada atasan tanpa berbicara dengannya lebih dulu','Membiarkan saja karena setiap anggota dianggap bertanggung jawab sendiri-sendiri','Mengusulkan agar anggota yang pasif dikeluarkan dari tim secepatnya'],[3,5,2,1,1],'Terbaik: mengajak diskusi dan membagi tugas sesuai kemampuan membuat anggota ikut berkontribusi. Kurang tepat: mengambil alih semua tugas tidak menyelesaikan akar masalah. Paling kurang tepat: membiarkan merugikan tim.'),

K('Anda diminta menggantikan rekan yang sakit pada tugas di luar tugas pokok. Anda...',['Menolak permintaan itu','Bersedia membantu sambil memastikan tugas sendiri selesai','Bersedia membantu tetapi mengerjakannya seadanya','Bersedia membantu asalkan mendapat imbalan atau kompensasi tertentu dari kantor','Menyuruh pegawai lain saja untuk menggantikan rekan yang sedang sakit itu'],[1,5,3,2,1],'Terbaik: membantu tanpa menelantarkan tugas sendiri. Kurang tepat: membantu seadanya menurunkan kualitas kerja. Paling kurang tepat: menolak tidak mencerminkan kerja sama tim.'),
K('Rekan mengkritik hasil kerja Anda. Anda...',['Tersinggung dan membalas kritik itu dengan menyebut kekurangan rekan tersebut','Mendengarkan lalu memperbaiki bagian yang memang perlu','Mengabaikan kritik tersebut','Mencari kesalahan rekan tersebut','Menerima semua kritik apa adanya tanpa mengevaluasi isi dan kebenarannya'],[1,5,2,1,3],'Terbaik: kritik didengar dan hanya yang relevan diperbaiki. Kurang tepat: menerima tanpa menilai bukan sikap kritis. Paling kurang tepat: membalas kritik menutup ruang perbaikan.'),
K('Jam kerja habis tetapi antrean layanan masih panjang. Anda...',['Menutup layanan tepat waktu sesuai jam kerja walaupun antrean masih panjang','Tetap melayani sampai seluruh antrean selesai, lalu mencatat kendala agar layanan berikutnya lebih lancar','Melayani sebagian warga saja lalu menutup layanan karena jam kerja habis','Menunda sisa antrean ke hari berikutnya tanpa memberi informasi kepada warga','Meminta rekan lain melanjutkan layanan sementara saya pulang tepat waktu'],[1,5,3,1,2],'Terbaik: melayani sampai tuntas dan mencatat kendala menunjukkan orientasi pelayanan. Kurang tepat: melayani sebagian meninggalkan warga tanpa kepastian. Paling kurang tepat: menutup tepat waktu mengabaikan antrean.'),
K('Pemohon layanan memberi hadiah sebagai ucapan terima kasih. Anda...',['Menerima hadiah itu karena diberikan tanpa diminta dan sebagai tanda terima kasih','Menolak dengan sopan dan menjelaskan bahwa aturan gratifikasi melarang pegawai menerima pemberian tersebut','Menerima hadiah itu lalu membaginya kepada rekan sekantor secara merata','Menerima hadiah itu dan baru melaporkannya setelah beberapa waktu kemudian','Menolak hadiah itu dengan nada kasar agar pemohon tidak mengulanginya'],[1,5,2,3,2],'Terbaik: menolak sopan dan menjelaskan aturan gratifikasi. Kurang tepat: melapor belakangan terlambat dari kewajiban melapor. Paling kurang tepat: menerima melanggar aturan integritas.'),
K('Anda melihat rekan memakai fasilitas kantor untuk keperluan pribadi. Anda...',['Membiarkan rekan tersebut','Menegur dan mengingatkan aturan, lalu melapor bila berulang','Ikut memakai fasilitas kantor itu','Memposting perbuatan rekan tersebut di media sosial','Melaporkan rekan tersebut kepada atasan tanpa menegurnya terlebih dahulu'],[1,5,1,1,3],'Terbaik: menegur dulu lalu melapor bila berulang, sesuai tahapan. Kurang tepat: langsung melapor melewati tahap teguran. Paling kurang tepat: membiarkan berarti ikut melanggengkan pelanggaran.'),
K('Tim berselisih pendapat saat tenggat proyek mepet. Anda...',['Memaksakan pendapat sendiri','Memfasilitasi diskusi dan mencari kesepakatan demi tujuan tim','Mengikuti suara terbanyak saja tanpa membahas alasan di balik tiap pendapat','Mundur dari tim karena perbedaan pendapat dianggap terlalu menghambat pekerjaan','Menyerahkan keputusan kepada atasan tanpa memberikan usulan apa pun dari tim'],[1,5,3,1,2],'Terbaik: memfasilitasi diskusi menjaga tim fokus pada tujuan. Kurang tepat: suara terbanyak tanpa diskusi mengabaikan alasan. Paling kurang tepat: memaksakan pendapat merusak kerja sama.'),
K('Ada pelatihan penting yang bertepatan dengan agenda pribadi. Anda...',['Menolak mengikuti pelatihan karena agenda pribadi sudah terlanjur disusun lebih dulu','Mengatur ulang agenda pribadi agar bisa mengikuti pelatihan','Mengikuti pelatihan tetapi sering izin keluar','Menyuruh rekan menggantikan saya mengikuti pelatihan penting tersebut sepenuhnya','Mengikuti pelatihan secara formalitas tanpa benar-benar memperhatikan materinya'],[1,5,3,1,2],'Terbaik: pengembangan diri didahulukan dengan menata ulang agenda pribadi. Kurang tepat: sering izin keluar mengurangi manfaat pelatihan. Paling kurang tepat: menolak melewatkan kesempatan belajar.'),
K('Anda menilai prosedur kerja dapat disederhanakan. Anda...',['Diam saja karena prosedur sudah ditetapkan dan bukan wewenang saya mengubahnya','Mengusulkan perbaikan kepada atasan beserta alasan dan contoh manfaatnya bagi pelayanan','Mengubah sendiri prosedur itu agar pekerjaan terasa lebih cepat dan sederhana','Mengeluh kepada rekan tentang prosedur yang rumit tanpa menyampaikan usulan','Menunggu sampai atasan meminta masukan baru kemudian menyampaikan usulan saya'],[2,5,1,1,3],'Terbaik: perbaikan diusulkan lewat atasan dengan alasan jelas. Kurang tepat: menunggu diminta bersikap pasif. Paling kurang tepat: mengubah prosedur sendiri melanggar kewenangan.'),
K('Penyandang disabilitas kesulitan mengisi formulir di loket Anda. Anda...',['Menyarankan agar ia ditemani anggota keluarga yang bisa membantu mengisi formulir','Membantu dengan ramah sampai formulir selesai diisi dan memastikan semua datanya sudah benar','Memberikan formulir kosong lalu membiarkan ia mengisinya sendiri sampai selesai','Mengarahkan ia ke loket lain yang dianggap lebih cocok untuk kebutuhannya','Membantu mengisi sebagian lalu meminta ia menyelesaikan sisanya tanpa bantuan lagi'],[2,5,1,1,3],'Terbaik: membantu sampai selesai mencerminkan pelayanan inklusif. Kurang tepat: membantu setengah-setengah tetap menyulitkan. Paling kurang tepat: membiarkan mengisi sendiri mengabaikan kebutuhan penyandang disabilitas.'),
K('Atasan baru Anda bergaya kerja berbeda dari atasan lama. Anda...',['Sering membandingkan cara kerja atasan baru dengan atasan lama di depan rekan','Menyesuaikan diri dan menanyakan harapan atasan baru','Menunggu atasan baru menyesuaikan diri dengan cara kerja yang sudah berjalan','Tetap bekerja dengan cara sendiri','Meminta dipindahkan ke unit lain yang masih dipimpin atasan lama saya'],[1,5,2,2,1],'Terbaik: menyesuaikan diri dan menanyakan harapan atasan baru. Paling kurang tepat: membandingkan di depan rekan merusak hubungan kerja.'),
K('Saat libur, kantor menelepon soal masalah mendesak. Anda...',['Mengabaikan telepon itu karena sedang libur dan sudah memberi tahu sebelumnya','Membantu memberi arahan sesuai kemampuan','Menyuruh kantor menelepon kembali besok ketika jam kerja sudah dimulai lagi','Mematikan telepon agar waktu libur tidak terganggu urusan pekerjaan kantor','Marah kepada penelepon'],[1,5,2,1,1],'Terbaik: tetap membantu secukupnya karena masalahnya mendesak. Paling kurang tepat: mengabaikan panggilan mendesak menunjukkan tanggung jawab yang rendah.'),
K('Anda ditugaskan menyusun laporan di luar keahlian Anda. Anda...',['Menolak tugas itu karena bukan bidang yang saya kuasai sama sekali','Belajar dan bertanya kepada yang berpengalaman','Mengerjakan laporan itu seadanya sesuai kemampuan yang saya miliki saat ini','Meminta rekan yang lebih ahli mengerjakan seluruh laporan itu sebagai gantinya','Menunda pengerjaan laporan itu sampai waktunya sudah sangat mendekati tenggat'],[1,5,2,1,1],'Terbaik: belajar dan bertanya kepada yang berpengalaman. Paling kurang tepat: menolak tugas karena bukan bidang berarti menghindari tantangan.'),

T('TWK','Mahkamah Agung termasuk kekuasaan...',['Legislatif','Eksekutif','Yudikatif','Konsultatif','Inspektif'],2,'Mahkamah Agung memegang kekuasaan kehakiman (yudikatif). Legislatif membuat undang-undang dan eksekutif menjalankannya.'),
T('TWK','Lambang sila kedua Pancasila adalah...',['Bintang','Rantai','Pohon beringin','Kepala banteng','Padi dan kapas'],1,'Rantai melambangkan sila kedua. Bintang sila pertama, pohon beringin sila ketiga, kepala banteng sila keempat, padi dan kapas sila kelima.'),
T('TWK','MPR terdiri atas anggota...',['DPR dan DPD','DPR dan DPRD','DPR dan Presiden','DPD dan DPRD','DPR dan MA'],0,'Pasal 2 ayat (1): MPR terdiri atas anggota DPR dan anggota DPD yang dipilih melalui pemilihan umum.'),

T('TWK','Perundingan yang mengakui kekuasaan de facto RI atas Jawa, Madura, dan Sumatra adalah...',['Renville','Linggarjati','Roem-Royen','KMB','Kalijati'],1,'Perundingan Linggarjati mengakui kekuasaan de facto RI atas Jawa, Madura, dan Sumatra. Renville dan Roem-Royen adalah perundingan sesudahnya.'),

T('TIU','Pedagang membeli Rp200.000 dan menjual Rp250.000. Persentase untungnya...',['20%','22%','25%','30%','50%'],2,'50.000 / 200.000 = 25%.'),

K('Anda melihat dokumen rahasia tergeletak di meja rekan. Anda...',['Membaca dokumen itu sekilas karena penasaran dengan isinya yang tampak penting','Menyimpan dokumen itu dengan aman lalu memberi tahu pemiliknya agar segera diambil kembali','Memotret dokumen itu untuk berjaga-jaga kalau suatu saat diperlukan nanti','Membiarkannya tetap di meja karena itu bukan urusan dan tanggung jawab saya','Menceritakan isi dokumen itu kepada rekan lain yang kebetulan sedang lewat'],[1,5,1,2,1],'Terbaik: mengamankan dokumen dan memberi tahu pemiliknya menjaga kerahasiaan. Paling kurang tepat: membacanya melanggar etika menjaga informasi.'),
K('Anda diminta mewakili kantor di acara yang belum pernah Anda ikuti. Anda...',['Menolak mewakili kantor','Mencari informasi dan mempersiapkan diri','Menerima tugas itu lalu datang tanpa persiapan khusus karena acaranya sederhana','Meminta rekan lain yang lebih berpengalaman untuk mewakili kantor menggantikan saya','Menunda jawaban kepada atasan sampai mendekati hari pelaksanaan acara tersebut'],[1,5,2,1,2],'Terbaik: mempersiapkan diri dengan mencari informasi. Paling kurang tepat: menolak mewakili kantor menghindari tanggung jawab.'),
K('Rekan mendapat penghargaan padahal kontribusi Anda juga besar. Anda...',['Iri lalu menjauhi rekan tersebut karena merasa kontribusi saya tidak dihargai','Mengucapkan selamat kepada rekan tersebut dan terus meningkatkan kualitas kerja saya sendiri','Menyebut kontribusi saya sendiri di depan umum agar semua orang mengetahuinya','Mengurangi kinerja karena merasa usaha saya tidak pernah mendapat penghargaan','Mengeluh kepada atasan bahwa penghargaan itu seharusnya juga diberikan kepada saya'],[1,5,2,1,2],'Terbaik: sportif memberi selamat dan terus berprestasi. Paling kurang tepat: iri dan menjauh merusak hubungan kerja.'),
K('Jadwal berubah mendadak dan mengganggu rencana Anda. Anda...',['Mengeluh kepada rekan','Menyesuaikan dan menata ulang rencana','Menolak mengikuti jadwal baru','Datang terlambat sebagai bentuk protes atas perubahan jadwal yang mendadak itu','Meminta jadwal dikembalikan seperti semula sebelum mau menjalankan tugasnya lagi'],[2,5,1,1,2],'Terbaik: fleksibel menata ulang rencana. Paling kurang tepat: menolak jadwal baru menghambat kerja tim.'),
K('Pengunjung bertanya hal di luar bidang Anda. Anda...',['Mengatakan bahwa pertanyaan itu bukan urusan saya dan bukan bidang saya','Mengantar atau mengarahkan pengunjung ke petugas yang tepat sambil menjelaskan alurnya dengan jelas','Menjawab sekenanya berdasarkan perkiraan agar pengunjung tidak merasa diabaikan','Mengabaikan pertanyaan itu dan melanjutkan pekerjaan yang sedang saya kerjakan','Menyuruh pengunjung bertanya kepada orang lain tanpa menunjukkan siapa orangnya'],[1,5,1,1,2],'Terbaik: mengantar pengunjung ke petugas yang tepat sampai urusannya jelas. Paling kurang tepat: menjawab bukan urusan saya bertentangan dengan pelayanan.'),
K('Anda diberi target kerja yang tinggi. Anda...',['Menyatakan target itu mustahil dicapai dan tidak perlu diusahakan lebih jauh','Menyusun rencana dan berusaha mencapainya','Mengerjakan sekadarnya saja karena target setinggi itu pasti sulit tercapai','Meminta atasan menurunkan target','Berhenti berusaha di tengah jalan ketika melihat target belum juga tercapai'],[1,5,2,2,1],'Terbaik: target dihadapi dengan rencana. Paling kurang tepat: menyatakan mustahil tanpa mencoba menandakan sikap menyerah.'),
K('Rekan baru kesulitan beradaptasi. Anda...',['Membiarkan rekan baru itu menyesuaikan diri sendiri tanpa dibantu siapa pun','Membimbing dan mengenalkan lingkungan kerja','Menertawakan kesalahan rekan baru itu sebagai bahan candaan di antara rekan','Melaporkan kelemahan rekan baru itu kepada atasan agar segera diberi teguran','Menghindari rekan baru itu karena dianggap hanya akan memperlambat pekerjaan'],[1,5,1,2,1],'Terbaik: membimbing rekan baru mempercepat adaptasinya. Paling kurang tepat: membiarkannya sendiri membuat rekan tersisih.'),
K('Anda membuat kesalahan yang merugikan tim. Anda...',['Menyembunyikan kesalahan itu','Mengakui, meminta maaf, dan memperbaiki','Menyalahkan rekan yang ikut terlibat supaya kesalahan terlihat tidak sepenuhnya milik saya','Mengabaikan kesalahan itu karena kerugiannya dianggap tidak terlalu besar bagi tim','Pergi dari ruangan agar tidak diminta menjelaskan penyebab kesalahan tersebut'],[1,5,1,2,1],'Terbaik: akuntabel dengan mengakui, meminta maaf, dan memperbaiki. Paling kurang tepat: menyembunyikan kesalahan menambah kerugian tim.'),
K('Anda diminta lembur menyelesaikan pekerjaan mendesak. Anda...',['Menolak lembur karena sudah melewati jam kerja yang ditetapkan oleh kantor','Bersedia lembur dan menyelesaikan pekerjaan itu dengan baik sampai target hari itu terpenuhi','Bersedia lembur tetapi terus mengeluh selama mengerjakan pekerjaan tersebut','Bersedia lembur tetapi pulang lebih awal sebelum pekerjaan benar-benar selesai','Meminta upah lembur dibayarkan lebih dulu sebelum mulai mengerjakan pekerjaan'],[1,5,3,2,1],'Terbaik: bersedia dan menyelesaikan dengan baik menunjukkan dedikasi. Kurang tepat: lembur sambil mengeluh menurunkan semangat tim. Paling kurang tepat: menolak mengabaikan kebutuhan mendesak.'),
K('Anda mendengar gosip tentang rekan kerja. Anda...',['Menyebarkan gosip itu kepada rekan lain','Tidak ikut menyebarkan dan mengingatkan agar tidak bergosip','Mencari tahu lebih banyak soal gosip itu karena merasa penasaran dengan kebenarannya','Menambahkan cerita lain agar pembicaraan tentang rekan tersebut terdengar lebih seru','Mengabaikan saja gosip itu dan tidak ikut berkomentar apa pun kepada siapa pun'],[1,5,2,1,3],'Terbaik: tidak ikut menyebarkan dan mengingatkan menjaga suasana kerja. Kurang tepat: diam saja tidak mencegah gosip meluas. Paling kurang tepat: menyebarkan merusak hubungan kerja.'),
K('Anda mendapat tugas dengan instruksi kurang jelas. Anda...',['Mengerjakan tugas itu sesuai tebakan saya sendiri tentang maksud pemberi tugas','Menanyakan kejelasan kepada pemberi tugas','Menunda tugas itu sampai ada orang lain yang menjelaskan maksud instruksinya','Meminta rekan lain saja yang mengerjakan karena instruksinya kurang jelas bagi saya','Mengerjakan seperlunya saja'],[2,5,1,1,2],'Terbaik: bertanya kepada pemberi tugas memastikan pekerjaan sesuai harapan. Paling kurang tepat: menunda tanpa bertanya menghambat pekerjaan.'),
K('Melayani cepat tetapi melanggar SOP, atau sesuai SOP tetapi lebih lama. Anda...',['Melanggar SOP demi kecepatan','Mengikuti SOP dan menjelaskan alasannya kepada warga','Mengikuti SOP seperti biasa tanpa menjelaskan alasan apa pun kepada warga','Meminta warga menunggu tanpa memberi kepastian kapan layanan akan diselesaikan','Menyuruh warga datang lagi di lain hari'],[1,5,3,2,1],'Terbaik: patuh SOP dan menjelaskan alasannya kepada warga. Kurang tepat: patuh tanpa penjelasan kurang komunikatif. Paling kurang tepat: melanggar SOP demi kecepatan melemahkan akuntabilitas.'),
K('Anda ingin meningkatkan kompetensi tetapi tidak ada pelatihan resmi. Anda...',['Menunggu sampai kantor menyelenggarakan pelatihan resmi untuk meningkatkan kemampuan','Belajar mandiri dari sumber yang terpercaya lalu mempraktikkannya dalam pekerjaan sehari-hari','Mengeluh karena kantor tidak menyediakan pelatihan resmi yang dibutuhkan pegawai','Meminta pindah ke kantor lain yang rutin menyelenggarakan pelatihan resmi','Tidak berbuat apa-apa karena merasa kemampuan saat ini sudah cukup memadai'],[2,5,1,1,1],'Terbaik: belajar mandiri dari sumber terpercaya dan langsung mempraktikkannya. Paling kurang tepat: mengeluh tidak mengembangkan kompetensi.'),
K('Rekan meminta Anda mengubah data agar laporan tampak baik. Anda...',['Menuruti permintaan itu supaya hubungan dengan rekan tetap baik dan tidak renggang','Menolak dengan tegas dan menjelaskan risiko hukum serta dampaknya bagi kami berdua','Menuruti sebagian permintaan itu saja agar tidak terlalu melanggar aturan yang ada','Mengubah data lalu melaporkan perubahan itu kepada atasan setelah laporan dikirim','Mengabaikan permintaan itu tanpa menjawab apa pun kepada rekan yang meminta'],[1,5,2,2,3],'Terbaik: menolak tegas dan menjelaskan risiko menjaga integritas. Kurang tepat: tidak menjawab tidak menghentikan permintaan. Paling kurang tepat: menuruti berarti ikut memanipulasi data.'),
T('TIU','Deret: 4, 8, 16, 32, ... angka berikutnya?',['48','56','64','72','128'],2,'Setiap angka dikali 2.'),
T('TIU','2/5 dari 250 adalah...',['80','90','100','110','125'],2,'250 / 5 x 2 = 100.'),
T('TIU','Sinonim EFISIEN adalah...',['Boros','Tepat guna','Lambat','Rumit','Mahal'],1,'Efisien berarti tepat guna, hemat waktu dan tenaga.'),
K('Atasan meminta Anda menyampaikan kabar kurang menyenangkan kepada tim. Anda...',['Menunda penyampaian kabar itu sampai suasana tim terlihat lebih baik dan tenang','Menyampaikan dengan jelas, santun, dan disertai solusi','Meminta rekan lain menyampaikan kabar itu kepada tim menggantikan saya','Menyampaikan kabar itu dengan emosional agar tim mengerti betapa seriusnya masalah','Menyembunyikan kabar itu dari tim sampai ada waktu yang dianggap lebih tepat'],[2,5,1,1,1],'Terbaik: kabar disampaikan jelas, santun, dan disertai solusi. Paling kurang tepat: melimpahkan kepada rekan menghindari tanggung jawab.'),
K('Anda ditawari jabatan lebih tinggi tetapi merasa belum siap. Anda...',['Menolak jabatan itu langsung karena merasa kemampuan saya belum mencukupi sama sekali','Menerima sambil meminta bimbingan dan terus belajar','Menerima jabatan itu tanpa persiapan','Menunda jawaban kepada atasan tanpa kepastian sampai waktu yang tidak ditentukan','Menyuruh orang lain saja yang menerima jabatan itu menggantikan saya sepenuhnya'],[2,5,3,1,1],'Terbaik: berani menerima tantangan sambil meminta bimbingan. Kurang tepat: menerima tanpa persiapan berisiko menurunkan kinerja. Paling kurang tepat: menunda tanpa kepastian menyulitkan atasan.'),
K('Warga mengeluhkan layanan buruk di unit lain kepada Anda. Anda...',['Mengabaikan keluhan itu','Mendengarkan, mencatat, dan meneruskan ke pihak berwenang','Membenarkan keluhan itu dan ikut menjelekkan unit yang disebutkan oleh warga','Menyuruh warga melapor sendiri kepada unit yang bersangkutan tanpa bantuan saya','Menjanjikan masalah itu akan segera beres'],[1,5,1,2,1],'Terbaik: mendengar, mencatat, dan meneruskan ke pihak berwenang. Paling kurang tepat: mengabaikan keluhan warga bertentangan dengan pelayanan.'),
K('Atasan menegur Anda di hadapan banyak orang. Anda...',['Membantah teguran itu saat itu juga dengan alasan yang menurut saya masuk akal','Menerima, lalu membahasnya secara pribadi','Pergi meninggalkan ruangan karena merasa malu dan tidak mau menjadi pusat perhatian','Mengungkit kesalahan atasan sebelumnya','Diam saja di depan orang banyak tetapi menyimpan dendam kepada atasan tersebut'],[1,5,2,1,1],'Terbaik: menerima teguran dan membahasnya secara pribadi menunjukkan kedewasaan. Paling kurang tepat: membantah di depan umum merusak wibawa dan hubungan kerja.'),
K('Anda harus bekerja dengan rekan yang pernah berselisih dengan Anda. Anda...',['Menolak bekerja sama','Bersikap profesional dan fokus pada tujuan','Mengerjakan bagian masing-masing secara terpisah supaya tidak banyak berinteraksi','Mengungkit masalah lama','Meminta atasan mengganti anggota tim'],[1,5,3,1,2],'Terbaik: profesional dan fokus pada tujuan. Kurang tepat: bekerja terpisah menghindari kerja sama. Paling kurang tepat: menolak bekerja sama merugikan tim.'),
K('Anda ditugaskan di unit dengan fasilitas terbatas. Anda...',['Mengeluh kepada rekan karena fasilitas unit ini jauh lebih sedikit dari unit lain','Memanfaatkan sumber daya yang ada secara kreatif dan mengusulkan kebutuhan','Menolak penempatan itu karena fasilitas yang tersedia dinilai tidak memadai','Menunggu sampai fasilitas yang dibutuhkan datang baru mulai bekerja dengan serius','Bekerja seadanya dengan fasilitas yang ada tanpa berusaha mencari cara lain'],[2,5,1,3,2],'Terbaik: sumber daya yang ada dimanfaatkan kreatif dan kebutuhan diusulkan. Kurang tepat: menunggu fasilitas menunda pekerjaan. Paling kurang tepat: menolak penempatan menghindari tugas.'),
K('Rekan mengabari ada kesalahan kecil pada laporan Anda menjelang rapat. Anda...',['Mengabaikan kabar itu karena rapat segera dimulai','Segera memeriksa dan memperbaikinya','Tetap membawa laporan itu apa adanya ke rapat','Menyalahkan rekan yang menyusun datanya','Meminta rapat diundur tanpa alasan yang jelas'],[1,5,2,1,3],'Terbaik: segera memeriksa dan memperbaiki menjaga akurasi. Kurang tepat: meminta rapat diundur mengganggu orang lain. Paling kurang tepat: mengabaikan kabar berisiko menyajikan data keliru.'),
K('Lingkungan kantor tampak kotor. Anda...',['Menyuruh petugas kebersihan membersihkannya','Ikut membersihkan dan mengingatkan menjaga kebersihan','Membiarkannya karena itu bukan tugas pegawai biasa','Mengeluh kepada rekan tentang kebersihan kantor','Melapor ke atasan agar petugas segera datang'],[3,5,1,1,2],'Terbaik: ikut membersihkan dan mengingatkan menunjukkan kepedulian. Kurang tepat: menyuruh petugas kebersihan kurang peduli. Paling kurang tepat: membiarkan menganggap itu bukan urusan sendiri.'),
K('Rekan senior melakukan kesalahan prosedur. Anda...',['Diam karena segan menegur pegawai yang lebih senior','Mengingatkan dengan sopan','Mengoreksi kesalahannya di depan banyak orang','Melapor kepada atasan tanpa menanyakannya lebih dulu','Mengikuti cara senior itu supaya tidak dianggap melawan'],[2,5,1,3,1],'Terbaik: mengingatkan dengan sopan menghormati sekaligus menjaga prosedur. Kurang tepat: melapor tanpa bertanya melewati tahap komunikasi. Paling kurang tepat: mengoreksi di depan umum mempermalukan rekan.'),
K('Rekan minta bantuan padahal pekerjaan Anda sendiri menumpuk. Anda...',['Menolak mentah-mentah karena pekerjaan sendiri menumpuk','Membantu setelah menata prioritas','Membantu rekan itu dan mengabaikan pekerjaan sendiri','Mengiyakan permintaan itu lalu tidak mengerjakannya','Menyuruh rekan itu meminta tolong pada pegawai yang lain'],[1,5,2,1,2],'Terbaik: membantu setelah menata prioritas menjaga kedua pekerjaan. Paling kurang tepat: menolak mentah-mentah tidak mencerminkan kerja sama.'),
K('Anda ditunjuk sebagai koordinator kegiatan setelah rapat. Anda...',['Menolak ditunjuk sebagai koordinator kegiatan','Menerima, menyusun rencana, dan membagi tugas dengan jelas','Menerima penunjukan itu tanpa menyusun rencana apa pun','Menyerahkan tanggung jawab koordinator ke orang lain','Hanya mengawasi jalannya kegiatan dari kejauhan'],[1,5,2,1,2],'Terbaik: menerima, merencanakan, dan membagi tugas menunjukkan kepemimpinan. Paling kurang tepat: menolak penunjukan menghindari tanggung jawab.'),
T('TWK','UUD 1945 telah diamandemen sebanyak... kali',['2','3','4','5','6'],2,'UUD 1945 diamandemen empat kali, yaitu pada 1999, 2000, 2001, dan 2002.'),
T('TWK','Bumi, air, dan kekayaan alam dikuasai negara untuk kemakmuran rakyat diatur dalam Pasal...',['27','31','32','33','34'],3,'Pasal 33 mengatur perekonomian dan penguasaan bumi, air, serta kekayaan alam oleh negara untuk kemakmuran rakyat.'),
T('TWK','Hak setiap warga negara untuk mendapat pendidikan diatur dalam Pasal...',['28','29','30','31','32'],3,'Pasal 31 mengatur hak mendapat pendidikan. Pasal 28 mengatur hak asasi manusia dan Pasal 29 mengatur agama.'),
T('TWK','Tokoh yang mengusulkan paham negara integralistik dalam sidang BPUPKI adalah...',['Ir. Soekarno','Prof. Soepomo','Mohammad Yamin','Mohammad Hatta','Soetan Sjahrir'],1,'Soepomo mengusulkan paham integralistik pada sidang BPUPKI akhir Mei 1945. Soekarno mengusulkan Pancasila dan Mohammad Yamin mengusulkan lima asas.'),
T('TWK','Perang Jawa (1825-1830) dipimpin oleh...',['Sultan Hasanuddin','Pangeran Diponegoro','Imam Bonjol','Pattimura','Teuku Umar'],1,'Perang Jawa 1825-1830 dipimpin Pangeran Diponegoro. Imam Bonjol memimpin Perang Padri, Sultan Hasanuddin melawan VOC dari Gowa.'),
T('TWK','Salah satu isi Trias Van Deventer (Politik Etis) adalah...',['Irigasi','Kerja rodi','Tanam paksa','Monopoli garam','Pajak tanah'],0,'Trias Van Deventer terdiri atas irigasi, edukasi, dan emigrasi. Kerja rodi dan tanam paksa adalah kebijakan kolonial yang bersifat eksploitatif.'),
T('TWK','Pemilihan umum pertama di Indonesia diselenggarakan pada tahun...',['1945','1955','1959','1971','1977'],1,'Pemilu pertama berlangsung pada 1955 dan diikuti banyak partai. Pemilu berikutnya baru diadakan pada 1971.'),
T('TWK','Dekrit Presiden 5 Juli 1959 menetapkan...',['Kembali berlakunya UUD 1945','Berlakunya UUDS 1950','Berlakunya Konstitusi RIS','Pemilu ulang','Pembentukan negara federal'],0,'Dekrit Presiden 5 Juli 1959 membubarkan Konstituante dan menyatakan kembali berlakunya UUD 1945.'),
T('TWK','Menurut UUD 1945, kekuasaan pemerintahan negara dipegang oleh...',['Perdana Menteri','Presiden','MPR','DPR','Mahkamah Agung'],1,'Pasal 4 ayat (1): Presiden memegang kekuasaan pemerintahan. Indonesia menganut sistem presidensial, bukan parlementer.'),
T('TWK','Bahasa persatuan Indonesia berakar dari bahasa...',['Jawa','Melayu','Sunda','Minangkabau','Bugis'],1,'Bahasa Indonesia berakar dari bahasa Melayu yang lama menjadi bahasa perdagangan di Nusantara, lalu ditetapkan sebagai bahasa persatuan pada 1928.'),
T('TWK','Pernyataan bahwa Indonesia adalah negara hukum terdapat pada Pasal 1 ayat...',['1','2','3','4','5'],2,'Pasal 1 ayat (3): Negara Indonesia adalah negara hukum. Ayat (1) mengatur bentuk negara dan ayat (2) kedaulatan rakyat.'),
T('TWK','Pancasila sebagai ideologi terbuka berarti...',['Nilai dasarnya dapat diganti','Nilai dasar tetap, nilai instrumental berkembang sesuai zaman','Dapat diubah oleh siapa saja','Tidak memiliki nilai dasar','Hanya berlaku untuk masa lalu'],1,'Ideologi terbuka: nilai dasar Pancasila bersifat tetap, sedangkan nilai instrumental dan praktiknya dapat berkembang mengikuti zaman.'),
T('TWK','Pendiri Perguruan Taman Siswa adalah...',['Ki Hajar Dewantara','dr. Soetomo','R.A. Kartini','K.H. Ahmad Dahlan','Dewi Sartika'],0,'Ki Hajar Dewantara mendirikan Taman Siswa pada 1922. dr. Soetomo adalah pendiri Budi Utomo.'),
T('TWK','Muhammadiyah didirikan pada tahun...',['1905','1908','1912','1926','1945'],2,'K.H. Ahmad Dahlan mendirikan Muhammadiyah pada 1912. Budi Utomo berdiri pada 1908.'),
K('Anda diminta menjadi narasumber tetapi gugup berbicara di depan umum. Anda...',['Menolak menjadi narasumber karena gugup','Menerima dan berlatih sebelum tampil','Menerima tawaran itu tanpa persiapan sama sekali','Meminta orang lain menggantikan tanpa memberi alasan','Menunda jawaban terus sampai acaranya sudah dekat'],[1,5,2,1,2],'Terbaik: berani dan mempersiapkan diri.'),
K('Pekerjaan Anda selesai lebih cepat sementara rekan masih kewalahan. Anda...',['Pulang lebih awal karena target pribadi sudah tercapai','Menawarkan bantuan kepada rekan','Bersantai sambil menunggu jam kerja berakhir','Mengerjakan urusan pribadi di jam kantor','Menunggu perintah atasan untuk pekerjaan berikutnya'],[2,5,1,1,3],'Terbaik: proaktif membantu tim.'),
